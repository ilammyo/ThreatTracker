name: Build and Deploy ThreatTracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the keep-alive step re-enable this workflow

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Build feed data
        env:
          # Optional. Raises the NVD rate limit from 5 to 50 requests per 30s.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PREVIOUS_DATA_URL: https://ilammyo.github.io/ThreatTracker/data/alerts.json
        run: python scripts/build_data.py

      - name: Stamp cache-busting version
        run: sed -i "s/__BUILD__/${GITHUB_RUN_ID}/g" docs/index.html

      - name: Keep schedule alive
        # GitHub disables cron schedules after 60 days without repo activity.
        # Re-enabling the workflow on every run resets that timer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/enable"
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
